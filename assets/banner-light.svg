<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sunlit haze over a cloud sea">
  <defs>
    <linearGradient id="skyL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b7d4f5"/>
      <stop offset="45%" stop-color="#e7eef8"/>
      <stop offset="100%" stop-color="#f6e7c8"/>
    </linearGradient>
    <radialGradient id="sun" cx="82%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe6a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe6a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d9e4f2" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#skyL)"/>
  <circle cx="980" cy="60" r="220" fill="url(#sun)"/>
  <ellipse cx="200" cy="270" rx="280" ry="70" fill="url(#cloud)"/>
  <ellipse cx="520" cy="285" rx="340" ry="80" fill="url(#cloud)"/>
  <ellipse cx="900" cy="275" rx="320" ry="75" fill="url(#cloud)"/>
  <text x="60" y="150" fill="#1c2438" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="42" font-weight="650">Timofey</text>
  <text x="60" y="190" fill="#4a5670" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="20">Web systems · databases · Linux — Novosibirsk</text>
  <text x="60" y="224" fill="#5b6a8a" font-family="ui-monospace, Consolas, monospace" font-size="16">ma.cyou</text>
</svg>
